# Static hosting for the YeneEta PWA (SvelteKit adapter-static build).
# Replace app.yourdomain.com below, then:
#   sudo cp mobile-app.nginx.conf /etc/nginx/sites-available/yeneeta-app
#   sudo ln -s /etc/nginx/sites-available/yeneeta-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.yourdomain.com

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    root /var/www/yeneeta-mobile-app/build;
    index index.html;

    # PWA service worker / manifest must never be cached long — they're how
    # the "one APK, update by deploying" model gets fresh content to
    # installed devices. Everything else is content-hashed by Vite, so it's
    # safe to cache aggressively.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one file whose CONTENT changes on every deploy (it
    # references that build's hashed chunk filenames) while its own filename
    # never does — with no explicit policy here, nginx sends only
    # Last-Modified/ETag, which lets a browser (and especially Telegram's
    # more aggressive in-app WebView cache) serve a stale cached copy on
    # resume without ever hitting the network. Matches this location
    # explicitly so it also applies to the SPA fallback below (try_files's
    # internal redirect to /index.html is re-matched against location
    # blocks, not just the literal "/" request).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — adapter-static was configured with fallback: 'index.html'.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
