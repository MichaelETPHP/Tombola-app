# Static hosting for the YeneEta PWA inside the Docker/Coolify build — same
# caching rules as deploy/mobile-app.nginx.conf (the bare-metal version),
# just without server_name/certbot concerns since Coolify's own proxy
# terminates TLS and forwards plain HTTP to this container on port 80.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PWA service worker / manifest must never be cached long — they're how
    # the "one APK, update by deploying" model gets fresh content to
    # installed devices. Everything else is content-hashed by Vite, so it's
    # safe to cache aggressively.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one file whose CONTENT changes on every deploy (it
    # references that build's hashed chunk filenames) while its own filename
    # never does — with no explicit policy here, nginx sends only
    # Last-Modified/ETag, which lets a browser (and especially Telegram's
    # more aggressive in-app WebView cache) serve a stale cached copy on
    # resume without ever hitting the network. That stale copy then loads
    # whatever OLD JS chunks it references — silently reproducing an
    # already-fixed bug with zero error signature, since nothing actually
    # failed, it just never fetched the current build. This is why the
    # client-side self-heal (unregister service worker + reload) couldn't
    # fully fix repeat crashes on its own: that only clears the SW cache
    # layer, not this one. Matches this location explicitly so it also
    # applies to the SPA fallback below (try_files's internal redirect to
    # /index.html is re-matched against location blocks, not just the
    # literal "/" request).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — adapter-static was configured with fallback: 'index.html'.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
