# Reverse proxy for the Tombola API (Hono/Bun on port 3435).
# Replace api.yourdomain.com below, then:
#   sudo cp api.nginx.conf /etc/nginx/sites-available/tombola-api
#   sudo ln -s /etc/nginx/sites-available/tombola-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.yourdomain.com

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:3435;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
