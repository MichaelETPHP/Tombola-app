# YeneEta development stack for the Coolify `dev` resource.
#
# Every setting is prefixed with DEV_ so project-level/production variables
# cannot silently leak into this stack. Add these variables only to the dev
# resource's Production Environment Variables section in Coolify.
#
# This file intentionally contains no host `ports:` mappings. Coolify's proxy
# routes the three exposed services using the domains configured on the dev
# resource. Runtime values use DEV_ names so they cannot collide with the
# production resource. Manage the Node runtime mode as a runtime-only variable
# on the Coolify dev resource. DEMO_OTP_ENABLED and MOCK_PAYMENTS provide the
# development behaviour.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    expose:
      - '3435'
    volumes:
      - api_uploads_dev:/app/uploads
    environment:
      PORT: '3435'
      API_BASE_URL: ${DEV_API_BASE_URL:-}
      DATABASE_URL: ${DEV_DATABASE_URL:-}
      DB_SCHEMA: ${DEV_DB_SCHEMA:-Tombola_DB}
      DB_SSL: ${DEV_DB_SSL:-false}
      DB_POOL_MIN: ${DEV_DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DEV_DB_POOL_MAX:-20}
      JWT_ACCESS_SECRET: ${DEV_JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${DEV_JWT_REFRESH_SECRET:-}
      SMS_API_URL: ${DEV_SMS_API_URL:-}
      SMS_API_KEY: ${DEV_SMS_API_KEY:-}
      SMS_API_USERNAME: ${DEV_SMS_API_USERNAME:-}
      SMS_API_PASSWORD: ${DEV_SMS_API_PASSWORD:-}
      SMS_SENDER_LABEL: ${DEV_SMS_SENDER_LABEL:-YeneEta}
      DEMO_OTP_ENABLED: ${DEV_DEMO_OTP_ENABLED:-true}
      # Short window for fast manual testing of the draw-trigger auto-reassign
      # cycle — production defaults to a real 60-minute window instead (see
      # docker-compose.yml).
      TRIGGER_TTL_MINUTES: ${DEV_TRIGGER_TTL_MINUTES:-5}
      CHAPA_SECRET_KEY: ${DEV_CHAPA_SECRET_KEY:-}
      CHAPA_WEBHOOK_SECRET: ${DEV_CHAPA_WEBHOOK_SECRET:-}
      CHAPA_MODE: ${DEV_CHAPA_MODE:-test}
      MOCK_PAYMENTS: ${DEV_MOCK_PAYMENTS:-true}
      MOCK_PAYMENTS_SECRET: ${DEV_MOCK_PAYMENTS_SECRET:-}
      TELEBIRR_APP_ID: ${DEV_TELEBIRR_APP_ID:-}
      TELEBIRR_APP_KEY: ${DEV_TELEBIRR_APP_KEY:-}
      MOBILE_APP_URL: ${DEV_MOBILE_APP_URL:-}
      ADMIN_APP_URL: ${DEV_ADMIN_APP_URL:-}
      CORS_ORIGINS: ${DEV_CORS_ORIGINS:-}
      TELEGRAM_BOT_TOKEN: ${DEV_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CLIENT_ID: ${DEV_TELEGRAM_CLIENT_ID:-}
      TELEGRAM_AUTH_MAX_AGE_SECONDS: ${DEV_TELEGRAM_AUTH_MAX_AGE_SECONDS:-3600}
      TELEGRAM_WEBHOOK_SECRET: ${DEV_TELEGRAM_WEBHOOK_SECRET:-}
    healthcheck:
      # Container health measures whether the API process can serve requests.
      # Use /health separately when checking DB/config readiness.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3435/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

  mobile-app:
    build:
      context: .
      dockerfile: mobile-app/Dockerfile
      args:
        VITE_API_URL: ${DEV_VITE_API_URL:-}
        VITE_CHAPA_PUBLIC_KEY: ${DEV_VITE_CHAPA_PUBLIC_KEY:-}
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      api:
        condition: service_healthy

  admin-app:
    build:
      context: .
      dockerfile: admin-app/Dockerfile
      args:
        VITE_API_URL: ${DEV_VITE_API_URL:-}
    restart: unless-stopped
    expose:
      - '5355'
    environment:
      PORT: '5355'
      HOST: '0.0.0.0'
      ORIGIN: ${DEV_ADMIN_APP_URL:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_uploads_dev:
