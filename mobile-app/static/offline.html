<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>251 Lottery</title>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
      }

      :root {
        --color-primary: #0135c6;
        --color-primary-dark: #0129a3;
        --color-offline: #d8434c;
        --color-ink: #1a1d29;
        --color-muted: #8a8fa3;
        --color-bg-start: #e1e9fc;
        --color-bg-end: #c3d7f5;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
        text-align: center;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--color-ink);
        background: linear-gradient(135deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%);
      }

      .badge {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 88px;
        height: 88px;
      }

      .badge::before,
      .badge::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(1, 53, 198, 0.12);
        background: rgba(255, 255, 255, 0.6);
      }

      .badge::before {
        width: 88px;
        height: 88px;
      }

      .badge::after {
        width: 66px;
        height: 66px;
        border-color: rgba(1, 53, 198, 0.2);
        background: rgba(255, 255, 255, 0.8);
      }

      .badge-icon {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 15px;
        background: var(--color-ink);
        box-shadow: 0 18px 35px -18px rgba(26, 29, 41, 0.55);
        color: var(--color-offline);
      }

      .eyebrow {
        margin: 0;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-primary-dark);
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        max-width: 280px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--color-muted);
      }

      #status-text {
        min-height: 18px;
        font-size: 13px;
        font-weight: 600;
        color: var(--color-primary-dark);
      }

      button {
        margin-top: 4px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 28px;
        border: none;
        border-radius: 16px;
        background: var(--color-ink);
        color: #ffffff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 140ms var(--ease-out), opacity 140ms var(--ease-out);
      }

      button:active {
        transform: scale(0.97);
        opacity: 0.9;
      }

      .retry-icon {
        display: inline-flex;
      }

      .retry-icon.spinning {
        animation: spin 0.75s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="badge">
      <span class="badge-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        </svg>
      </span>
    </div>
    <p class="eyebrow">251 Lottery</p>
    <div>
      <h1>You&rsquo;re offline</h1>
      <p>Turn on Wi-Fi or mobile data — this screen will disappear automatically once you&rsquo;re back online.</p>
    </div>
    <div id="status-text"></div>
    <button id="retry-btn" type="button">
      <svg id="retry-icon" class="retry-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <path d="M21 3v6h-6" />
      </svg>
      <span id="retry-label">Try again</span>
    </button>

    <script>
      (function () {
        function targetUrl() {
          try {
            var url = window.Capacitor && window.Capacitor.getServerUrl && window.Capacitor.getServerUrl();
            return url || '/';
          } catch (e) {
            return '/';
          }
        }

        var statusEl = document.getElementById('status-text');
        var retryBtn = document.getElementById('retry-btn');
        var retryIcon = document.getElementById('retry-icon');
        var retryLabel = document.getElementById('retry-label');
        var attempt = 0;
        var checking = false;

        function attemptReconnect() {
          if (checking) return;
          checking = true;
          retryIcon.classList.add('spinning');
          retryLabel.textContent = 'Checking…';
          attempt += 1;
          statusEl.textContent = attempt === 1 ? 'Checking connection…' : 'Still trying… (attempt ' + attempt + ')';

          var url = targetUrl();
          fetch(url, { mode: 'no-cors', cache: 'no-store' })
            .then(function () {
              statusEl.textContent = 'Connected — loading…';
              window.location.href = url;
            })
            .catch(function () {
              statusEl.textContent = 'Still trying to reach the server…';
            })
            .finally(function () {
              checking = false;
              retryIcon.classList.remove('spinning');
              retryLabel.textContent = 'Try again';
            });
        }

        retryBtn.addEventListener('click', attemptReconnect);
        attemptReconnect();
        setInterval(attemptReconnect, 3000);
      })();
    </script>
  </body>
</html>
