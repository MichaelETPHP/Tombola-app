<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>YeneEta</title>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
      }

      :root {
        --color-primary: #00d3a0;
        --color-primary-dark: #00b589;
        --color-ink: #1a1d29;
        --color-muted: #8a8fa3;
        --color-bg-start: #e3f9ef;
        --color-bg-end: #b9eeda;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
        text-align: center;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--color-ink);
        background: linear-gradient(135deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%);
      }

      .spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3.5px solid rgba(0, 213, 160, 0.18);
        border-top-color: var(--color-primary-dark);
        animation: spin 0.75s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        max-width: 260px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--color-muted);
      }

      #status-text {
        min-height: 18px;
        font-size: 13px;
        font-weight: 600;
        color: var(--color-primary-dark);
      }

      button {
        margin-top: 8px;
        padding: 12px 28px;
        border: none;
        border-radius: 16px;
        background: var(--color-primary-dark);
        color: #ffffff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 140ms var(--ease-out), opacity 140ms var(--ease-out);
      }

      button:active {
        transform: scale(0.97);
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="spinner" role="status" aria-label="Reconnecting"></div>
    <div>
      <h1>Reconnecting&hellip;</h1>
      <p>Can&rsquo;t reach the server right now. This screen will disappear automatically once it&rsquo;s back.</p>
    </div>
    <div id="status-text"></div>
    <button id="retry-btn" type="button">Retry now</button>

    <script>
      (function () {
        function targetUrl() {
          try {
            var url = window.Capacitor && window.Capacitor.getServerUrl && window.Capacitor.getServerUrl();
            return url || '/';
          } catch (e) {
            return '/';
          }
        }

        var statusEl = document.getElementById('status-text');
        var retryBtn = document.getElementById('retry-btn');
        var attempt = 0;
        var checking = false;

        function attemptReconnect() {
          if (checking) return;
          checking = true;
          attempt += 1;
          statusEl.textContent = attempt === 1 ? 'Checking connection…' : 'Still trying… (attempt ' + attempt + ')';

          var url = targetUrl();
          fetch(url, { mode: 'no-cors', cache: 'no-store' })
            .then(function () {
              statusEl.textContent = 'Connected — loading…';
              window.location.href = url;
            })
            .catch(function () {
              statusEl.textContent = 'Still trying to reach the server…';
            })
            .finally(function () {
              checking = false;
            });
        }

        retryBtn.addEventListener('click', attemptReconnect);
        attemptReconnect();
        setInterval(attemptReconnect, 3000);
      })();
    </script>
  </body>
</html>
