<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1, minimum-scale=1, user-scalable=no" />
    <meta name="description" content="YeneEta — Ethiopia's premier raffle platform. Win amazing prizes with transparent, provably-fair draws." />
    <meta name="theme-color" content="#00D3A0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="YeneEta" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Self-heals the one class of error a stale service worker actually
      // causes: an already-open tab is still running an OLD JS bundle while
      // a NEW service worker (installed in the background, per
      // registerType:'autoUpdate') has already claimed every client and is
      // now serving fetches from its NEW precache manifest. The old JS then
      // fails in one of two ways — a lazy route chunk it wants isn't in
      // that new manifest (workbox's "non-precached-url"), or a shared
      // singleton module (svelte-i18n) ends up duplicated/reset by the
      // mismatch and throws "Cannot format a message without first setting
      // the initial locale". Both are unrecoverable for that tab short of a
      // reload — so catch them here, as early as possible (before the app
      // even boots), and reload once. sessionStorage guards against a
      // reload loop if a real, different error happens to match by
      // coincidence; hideBootSplash() clears the flag once the app has
      // actually rendered successfully, so a *later* genuine deploy can
      // still trigger exactly one more self-heal.
      (function () {
        var FLAG = 'yeneeta:stale-chunk-reload';
        function looksStale(message) {
          return typeof message === 'string' && (
            message.indexOf('setting the initial locale') !== -1 ||
            message.indexOf('non-precached-url') !== -1 ||
            message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            message.indexOf('Importing a module script failed') !== -1 ||
            // Chrome/Chromium WebViews: a stale service worker serving an
            // old chunk URL that the server (or nginx's SPA fallback) no
            // longer has gets answered with index.html instead of a 404 —
            // the browser then rejects it for having the wrong MIME type.
            message.indexOf('MIME type') !== -1
          );
        }
        function handle(message) {
          if (!looksStale(message)) return;
          try {
            if (sessionStorage.getItem(FLAG)) return;
            sessionStorage.setItem(FLAG, '1');
          } catch {
            // No sessionStorage (privacy mode, etc.) — fall through and
            // reload anyway; a loop here is still better than staying broken.
          }
          // A plain reload alone can be a no-op against exactly this bug:
          // the reload's own navigation request is still intercepted by
          // the SAME service worker whose cache is the actual problem, so
          // it can just re-serve the identical stale response and the page
          // breaks again immediately. Unregistering first forces this
          // navigation to skip the Service Worker entirely and hit the
          // network for real — actually fresh, not just re-asking the
          // thing that was already wrong.
          if (window.navigator && navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
              .catch(function () {})
              .then(function () { location.reload(); });
          } else {
            location.reload();
          }
        }
        window.addEventListener('error', function (e) { handle(e.message); });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          handle(reason && (reason.message || String(reason)));
        });
      })();
    </script>
    <script>
      // Public SMS draw links are deliberately instant: suppress the web
      // boot artwork and its preload before the first paint. Other routes
      // retain the high-priority splash preload.
      const directDrawEntry = /^\/draw\/[A-Za-z0-9_-]+\/?$/.test(location.pathname);
      if (directDrawEntry) {
        document.documentElement.classList.add('direct-draw-entry');
      } else {
        const splashPreload = document.createElement('link');
        splashPreload.rel = 'preload';
        splashPreload.href = '/images/splash-screen-1.jpg';
        splashPreload.as = 'image';
        splashPreload.fetchPriority = 'high';
        document.head.appendChild(splashPreload);
      }
    </script>
    <title>YeneEta</title>
    <!-- Load Telegram's bridge only for a real Mini App launch. The native
         APK and installed PWA avoid this external request entirely. -->
    <script>
      const launchParameters = `${location.search}&${location.hash}`;
      const isTelegramLaunch =
        typeof window.TelegramWebviewProxy !== 'undefined' ||
        launchParameters.includes('tgWebAppData=');

      if (isTelegramLaunch) {
        document.write('<script src="https://telegram.org/js/telegram-web-app.js?61"><\/script>');
      }
    </script>
    <style>
      /* Boot splash — bridges the gap between the native SplashScreen
         handoff (Android) and Svelte hydration finishing. Pure CSS/HTML so
         it paints before any JS runs; same background as the native splash
         (see capacitor.config.ts) so the transition reads as one continuous
         screen rather than two different ones. Removed by the root layout
         once the app is actually ready to show content.

         A locally bundled image and bottom scrim bridge the native-to-web
         handoff without waiting on an external request. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: linear-gradient(135deg, #e3f9ef 0%, #b9eeda 100%);
        transition: opacity 320ms cubic-bezier(0.23, 1, 0.32, 1);
        animation: boot-splash-auto-hide 280ms cubic-bezier(0.23, 1, 0.32, 1) 820ms forwards;
      }
      #boot-splash.boot-splash--hidden {
        opacity: 0;
        pointer-events: none;
        animation: none;
      }
      html.direct-draw-entry #boot-splash {
        display: none !important;
        animation: none !important;
      }
      .boot-splash__slide {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
      }

      @keyframes boot-splash-auto-hide {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      .boot-splash__scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(10, 8, 20, 0.55) 0%, transparent 32%);
        pointer-events: none;
      }
      .boot-splash__spinner {
        position: absolute;
        left: 50%;
        bottom: 56px;
        width: 28px;
        height: 28px;
        margin-left: -14px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        animation: boot-splash-spin 0.75s linear infinite;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          animation-duration: 1ms;
        }
        .boot-splash__spinner {
          animation: none;
          border-top-color: rgba(255, 255, 255, 0.3);
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <!-- "hover" never fires on a touch device — every navigation was a cold,
       unprimed fetch on every tap. "tap" starts preloading the instant a
       finger touches the link (touchstart fires well before the tap
       actually completes), hiding a slow route-chunk fetch behind the
       natural down-to-up time of the gesture instead of after it. This app
       has no +page.ts load functions anywhere, so preload-code (the route's
       JS chunk) is what actually matters here — preload-data is set too in
       case that ever changes. -->
  <body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="tap">
    <div style="display: contents">%sveltekit.body%</div>
    <div id="boot-splash" aria-hidden="true">
      <img src="/images/splash-screen-1.jpg" alt="" class="boot-splash__slide" fetchpriority="high" />
      <div class="boot-splash__scrim"></div>
      <span class="boot-splash__spinner"></span>
    </div>
  </body>
</html>
